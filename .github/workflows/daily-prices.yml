name: TIOS daily prices

on:
  schedule:
    - cron: "30 7 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch prices + macro
        run: python fetch_prices.py
      - name: Compute statistics
        run: python compute_stats.py
      - name: Commit if changed
        run: |
          git config user.name  "tios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.csv data/stats.json
          git commit -m "daily prices + stats $(date -u +%F)" || echo "no changes to commit"
          git push
